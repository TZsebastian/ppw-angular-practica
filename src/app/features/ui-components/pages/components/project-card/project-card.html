<div class="card bg-base-100 w-full shadow-sm border border-base-200">
  <figure>
    <img [src]="imageUrl()" [alt]="title()" class="w-full h-48 object-cover" />
  </figure>
  <div class="card-body p-5">
    <h2 class="card-title text-slate-950 font-bold">
      {{ title() }}
      <div class="badge badge-secondary text-xs">{{ badgeText() }}</div>
    </h2>
    <p class="text-sm text-slate-600 my-2">{{ description() }}</p>
    <div class="card-actions justify-end mt-2">
      @for (tag of tags(); track tag) {
        <div class="badge badge-outline text-xs">{{ tag }}</div>
      }
    </div>
  </div>
</div>
