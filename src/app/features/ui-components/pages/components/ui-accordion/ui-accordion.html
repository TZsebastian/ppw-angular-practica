<div class="collapse collapse-plus bg-base-100 border border-base-200 rounded-xl shadow-sm">
  <input type="radio" [name]="nameGroup()" checked="checked" />
  <div class="collapse-title text-sm font-bold text-slate-800">
    {{ title() }}
  </div>
  <div class="collapse-content text-xs text-slate-600">
    <p>{{ content() }}</p>
  </div>
</div>
